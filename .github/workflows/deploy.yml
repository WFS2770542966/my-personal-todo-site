name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image tag
        id: vars
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${LOWER_OWNER}/${{ github.event.repository.name }}/my-site:latest" >> $GITHUB_ENV

      - name: Build my-site Docker image
        run: docker build -t ${{ env.IMAGE_TAG }} ./my-site

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to ghcr.io
        run: docker push ${{ env.IMAGE_TAG }}
